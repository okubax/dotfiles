# Swaylock configuration — Zephyr Light
# Plain wallpaper with a colored indicator ring, Zephyr-matched per state:
# blue while typing, orange while verifying, red on a wrong password,
# purple on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/zephyr/light/swaylock.conf by zephyr-theme;
# edit that file, not this one, then re-run `zephyr-theme light`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/zephyr_light_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=FCFCFC
inside-ver-color=FCFCFC
inside-wrong-color=FCFCFC
inside-clear-color=FCFCFC
inside-caps-lock-color=FCFCFC
line-color=FCFCFC
line-clear-color=FCFCFC
line-ver-color=FCFCFC

# Ring: state feedback color
ring-color=3DAEE9
ring-ver-color=F67400
ring-wrong-color=DA4453
ring-clear-color=C7CBCF
ring-caps-lock-color=9B59B6

# Per-keystroke highlight segments
key-hl-color=27AE60
bs-hl-color=DA4453
caps-lock-key-hl-color=9B59B6
caps-lock-bs-hl-color=DA4453
separator-color=C7CBCF

# Typed-character count / status text
text-color=232629
text-clear-color=707D8A
text-ver-color=232629
text-wrong-color=DA4453
text-caps-lock-color=9B59B6

indicator-radius=150
font-size=32
