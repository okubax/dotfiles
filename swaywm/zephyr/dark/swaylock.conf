# Swaylock configuration — Zephyr Dark
# Minimal look: plain wallpaper, ring/segments hidden, only the typed-
# character feedback text visible in the accent color while unlocking.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/zephyr/dark/swaylock.conf by zephyr-theme;
# edit that file, not this one, then re-run `zephyr-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — they
# were previously in this config but silently ignored (unrecognized keys),
# doing nothing. If swaylock-effects is ever installed instead, those can
# be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/zephyr_dark_lockscreen.png
font=Ubuntu Mono
scaling=fill

# Hide the default indicator ring/text entirely (everything fully transparent)
text-ver-color=00000000
text-wrong-color=00000000
text-clear-color=00000000
inside-color=00000000
inside-ver-color=00000000
inside-wrong-color=00000000
inside-clear-color=00000000
inside-caps-lock-color=00000000
ring-color=00000000
ring-ver-color=00000000
ring-wrong-color=00000000
ring-clear-color=00000000
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
key-hl-color=00000000
bs-hl-color=00000000
caps-lock-bs-hl-color=00000000
caps-lock-key-hl-color=00000000
separator-color=00000000

# Only the typed-character feedback text stays visible, in the accent color
indicator-radius=350
font-size=125
text-color=3DAEE9
