# Swaylock configuration — Catppuccin Light (Latte)
# Plain wallpaper with a colored indicator ring, Catppuccin-matched per
# state: blue while typing, yellow while verifying, red on a wrong
# password, mauve on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/catppuccin/light/swaylock.conf by
# catppuccin-theme; edit that file, not this one, then re-run
# `catppuccin-theme light`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/catppuccin_light_lockscreen.png
font=Ubuntu Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=EFF1F5
inside-ver-color=EFF1F5
inside-wrong-color=EFF1F5
inside-clear-color=EFF1F5
inside-caps-lock-color=EFF1F5
line-color=EFF1F5
line-clear-color=EFF1F5
line-ver-color=EFF1F5

# Ring: state feedback color
ring-color=1E66F5
ring-ver-color=DF8E1D
ring-wrong-color=D20F39
ring-clear-color=9CA0B0
ring-caps-lock-color=8839EF

# Per-keystroke highlight segments
key-hl-color=40A02B
bs-hl-color=D20F39
caps-lock-key-hl-color=8839EF
caps-lock-bs-hl-color=D20F39
separator-color=9CA0B0

# Typed-character count / status text
text-color=4C4F69
text-clear-color=6C6F85
text-ver-color=4C4F69
text-wrong-color=D20F39
text-caps-lock-color=8839EF

indicator-radius=150
font-size=32
