# Swaylock configuration — Catppuccin Dusk (Macchiato)
# Plain wallpaper with a colored indicator ring, Catppuccin-matched per
# state: blue while typing, yellow while verifying, red on a wrong
# password, mauve on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/catppuccin/dusk/swaylock.conf by
# catppuccin-theme; edit that file, not this one, then re-run
# `catppuccin-theme dusk`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/catppuccin_dusk_lockscreen.png
font=Ubuntu Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=24273A
inside-ver-color=24273A
inside-wrong-color=24273A
inside-clear-color=24273A
inside-caps-lock-color=24273A
line-color=24273A
line-clear-color=24273A
line-ver-color=24273A

# Ring: state feedback color
ring-color=8AADF4
ring-ver-color=EED49F
ring-wrong-color=ED8796
ring-clear-color=6E738D
ring-caps-lock-color=C6A0F6

# Per-keystroke highlight segments
key-hl-color=A6DA95
bs-hl-color=ED8796
caps-lock-key-hl-color=C6A0F6
caps-lock-bs-hl-color=ED8796
separator-color=6E738D

# Typed-character count / status text
text-color=CAD3F5
text-clear-color=A5ADCB
text-ver-color=CAD3F5
text-wrong-color=ED8796
text-caps-lock-color=C6A0F6

indicator-radius=150
font-size=32
