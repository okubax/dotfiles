# Swaylock configuration — Catppuccin Dark (Mocha)
# Plain wallpaper with a colored indicator ring, Catppuccin-matched per
# state: blue while typing, yellow while verifying, red on a wrong
# password, mauve on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/catppuccin/dark/swaylock.conf by
# catppuccin-theme; edit that file, not this one, then re-run
# `catppuccin-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/catppuccin_dark_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=1E1E2E
inside-ver-color=1E1E2E
inside-wrong-color=1E1E2E
inside-clear-color=1E1E2E
inside-caps-lock-color=1E1E2E
line-color=1E1E2E
line-clear-color=1E1E2E
line-ver-color=1E1E2E

# Ring: state feedback color
ring-color=89B4FA
ring-ver-color=F9E2AF
ring-wrong-color=F38BA8
ring-clear-color=6C7086
ring-caps-lock-color=CBA6F7

# Per-keystroke highlight segments
key-hl-color=A6E3A1
bs-hl-color=F38BA8
caps-lock-key-hl-color=CBA6F7
caps-lock-bs-hl-color=F38BA8
separator-color=6C7086

# Typed-character count / status text
text-color=CDD6F4
text-clear-color=A6ADC8
text-ver-color=CDD6F4
text-wrong-color=F38BA8
text-caps-lock-color=CBA6F7

indicator-radius=150
font-size=32
