# Swaylock configuration — Litho Light
# Plain wallpaper with a monochrome indicator ring: emphasis is carried by
# tonal weight, not hue, since this scheme has none. Triggered by
# $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/.cfg-tzevaot/swaywm/litho/light/swaylock.conf by
# litho-theme; edit that file, not this one, then re-run
# `litho-theme light`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/litho_light_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=FFFFFF
inside-ver-color=FFFFFF
inside-wrong-color=FFFFFF
inside-clear-color=FFFFFF
inside-caps-lock-color=FFFFFF
line-color=FFFFFF
line-clear-color=FFFFFF
line-ver-color=FFFFFF

# Ring: state feedback, encoded as tonal weight (no hue available)
ring-color=000000
ring-ver-color=262626
ring-wrong-color=0D0D0D
ring-clear-color=737373
ring-caps-lock-color=8C8C8C

# Per-keystroke highlight segments
key-hl-color=595959
bs-hl-color=0D0D0D
caps-lock-key-hl-color=8C8C8C
caps-lock-bs-hl-color=0D0D0D
separator-color=737373

# Typed-character count / status text
text-color=000000
text-clear-color=737373
text-ver-color=000000
text-wrong-color=0D0D0D
text-caps-lock-color=8C8C8C

indicator-radius=150
font-size=32
