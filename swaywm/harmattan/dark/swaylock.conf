# Swaylock configuration — Harmattan Dark
# Plain wallpaper with a colored indicator ring, Harmattan-matched per state:
# indigo while typing, ochre while verifying, terracotta on a wrong password,
# bougainvillea on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/harmattan/dark/swaylock.conf by
# harmattan-theme; edit that file, not this one, then re-run
# `harmattan-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/harmattan_dark_lockscreen.png
font=Ubuntu Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=14120D
inside-ver-color=14120D
inside-wrong-color=14120D
inside-clear-color=14120D
inside-caps-lock-color=14120D
line-color=14120D
line-clear-color=14120D
line-ver-color=14120D

# Ring: state feedback color
ring-color=4C5FA6
ring-ver-color=D98A2B
ring-wrong-color=C1502E
ring-clear-color=473B29
ring-caps-lock-color=8B5A8C

# Per-keystroke highlight segments
key-hl-color=6E8C4E
bs-hl-color=C1502E
caps-lock-key-hl-color=8B5A8C
caps-lock-bs-hl-color=C1502E
separator-color=473B29

# Typed-character count / status text
text-color=F6EFDF
text-clear-color=B4A687
text-ver-color=F6EFDF
text-wrong-color=C1502E
text-caps-lock-color=8B5A8C

indicator-radius=150
font-size=32
