# Solarized Light — kitty terminal colors
# See ../light/palette.md for where each value comes from. ANSI 8-15 follow
# the official Solarized terminal mapping (base tones fill the "bright"
# black/white/green/yellow/blue/cyan slots; only red/magenta get a genuine
# second hue, orange/violet).

