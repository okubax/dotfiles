# Swaylock configuration — Solarized Dark
# Plain wallpaper with a colored indicator ring, Solarized-matched per state:
# blue while typing, yellow while verifying, red on a wrong password,
# magenta on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/solarized/dark/swaylock.conf by
# solarized-theme; edit that file, not this one, then re-run
# `solarized-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/solarized_dark_lockscreen.png
font=Ubuntu Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=002B36
inside-ver-color=002B36
inside-wrong-color=002B36
inside-clear-color=002B36
inside-caps-lock-color=002B36
line-color=002B36
line-clear-color=002B36
line-ver-color=002B36

# Ring: state feedback color
ring-color=268BD2
ring-ver-color=B58900
ring-wrong-color=DC322F
ring-clear-color=586E75
ring-caps-lock-color=D33682

# Per-keystroke highlight segments
key-hl-color=859900
bs-hl-color=DC322F
caps-lock-key-hl-color=D33682
caps-lock-bs-hl-color=DC322F
separator-color=586E75

# Typed-character count / status text
text-color=839496
text-clear-color=586E75
text-ver-color=839496
text-wrong-color=DC322F
text-caps-lock-color=D33682

indicator-radius=150
font-size=32
