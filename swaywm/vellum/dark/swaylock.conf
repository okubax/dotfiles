# Swaylock configuration — Vellum Dark
# Plain wallpaper with a monochrome indicator ring: emphasis is carried by
# tonal weight, not hue, since this scheme has none. Triggered by
# $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/.cfg-tzevaot/swaywm/vellum/dark/swaylock.conf by
# vellum-theme; edit that file, not this one, then re-run
# `vellum-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/vellum_dark_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=2E2E2E
inside-ver-color=2E2E2E
inside-wrong-color=2E2E2E
inside-clear-color=2E2E2E
inside-caps-lock-color=2E2E2E
line-color=2E2E2E
line-clear-color=2E2E2E
line-ver-color=2E2E2E

# Ring: state feedback, encoded as tonal weight (no hue available)
ring-color=E6E6E6
ring-ver-color=A2A2A2
ring-wrong-color=D2D2D2
ring-clear-color=8C8C8C
ring-caps-lock-color=9E9E9E

# Per-keystroke highlight segments
key-hl-color=B4B4B4
bs-hl-color=D2D2D2
caps-lock-key-hl-color=9E9E9E
caps-lock-bs-hl-color=D2D2D2
separator-color=8C8C8C

# Typed-character count / status text
text-color=DCDCDC
text-clear-color=8C8C8C
text-ver-color=DCDCDC
text-wrong-color=D2D2D2
text-caps-lock-color=9E9E9E

indicator-radius=150
font-size=32
