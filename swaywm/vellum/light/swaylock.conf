# Swaylock configuration — Vellum Light
# Plain wallpaper with a monochrome indicator ring: emphasis is carried by
# tonal weight, not hue, since this scheme has none. Triggered by
# $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/.cfg-tzevaot/swaywm/vellum/light/swaylock.conf by
# vellum-theme; edit that file, not this one, then re-run
# `vellum-theme light`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/vellum_light_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=E9E9E9
inside-ver-color=E9E9E9
inside-wrong-color=E9E9E9
inside-clear-color=E9E9E9
inside-caps-lock-color=E9E9E9
line-color=E9E9E9
line-clear-color=E9E9E9
line-ver-color=E9E9E9

# Ring: state feedback, encoded as tonal weight (no hue available)
ring-color=262626
ring-ver-color=6E6E6E
ring-wrong-color=404040
ring-clear-color=7A7A7A
ring-caps-lock-color=6A6A6A

# Per-keystroke highlight segments
key-hl-color=626262
bs-hl-color=404040
caps-lock-key-hl-color=6A6A6A
caps-lock-bs-hl-color=404040
separator-color=7A7A7A

# Typed-character count / status text
text-color=333333
text-clear-color=7A7A7A
text-ver-color=333333
text-wrong-color=404040
text-caps-lock-color=6A6A6A

indicator-radius=150
font-size=32
