# Swaylock configuration — Verdigris Light
# Plain wallpaper with a colored indicator ring, Verdigris-matched per
# state: copper while typing, gold while verifying, rust red on a wrong
# password, plum on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/.cfg-tzevaot/swaywm/verdigris/light/swaylock.conf by
# verdigris-theme; edit that file, not this one, then re-run
# `verdigris-theme light`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/verdigris_light_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=F4EFE6
inside-ver-color=F4EFE6
inside-wrong-color=F4EFE6
inside-clear-color=F4EFE6
inside-caps-lock-color=F4EFE6
line-color=F4EFE6
line-clear-color=F4EFE6
line-ver-color=F4EFE6

# Ring: state feedback color
ring-color=B85E24
ring-ver-color=96751C
ring-wrong-color=A8402A
ring-clear-color=5C6F66
ring-caps-lock-color=7A4F76

# Per-keystroke highlight segments
key-hl-color=4C7A3A
bs-hl-color=A8402A
caps-lock-key-hl-color=7A4F76
caps-lock-bs-hl-color=A8402A
separator-color=5C6F66

# Typed-character count / status text
text-color=24312B
text-clear-color=5C6F66
text-ver-color=24312B
text-wrong-color=A8402A
text-caps-lock-color=7A4F76

indicator-radius=150
font-size=32
