# Swaylock configuration — Verdigris Dark
# Plain wallpaper with a colored indicator ring, Verdigris-matched per
# state: copper while typing, gold while verifying, rust red on a wrong
# password, plum on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/.cfg-tzevaot/swaywm/verdigris/dark/swaylock.conf by
# verdigris-theme; edit that file, not this one, then re-run
# `verdigris-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/verdigris_dark_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=14201E
inside-ver-color=14201E
inside-wrong-color=14201E
inside-clear-color=14201E
inside-caps-lock-color=14201E
line-color=14201E
line-clear-color=14201E
line-ver-color=14201E

# Ring: state feedback color
ring-color=E08D4B
ring-ver-color=E0B84B
ring-wrong-color=D9634B
ring-clear-color=7FA69C
ring-caps-lock-color=A97CA5

# Per-keystroke highlight segments
key-hl-color=7FB069
bs-hl-color=D9634B
caps-lock-key-hl-color=A97CA5
caps-lock-bs-hl-color=D9634B
separator-color=7FA69C

# Typed-character count / status text
text-color=DCEDE8
text-clear-color=7FA69C
text-ver-color=DCEDE8
text-wrong-color=D9634B
text-caps-lock-color=A97CA5

indicator-radius=150
font-size=32
