# Swaylock configuration — Daguerre Dark
# Plain wallpaper with a monochrome indicator ring: emphasis is carried by
# tonal weight, not hue, since this scheme has none. Triggered by
# $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/.cfg-tzevaot/swaywm/daguerre/dark/swaylock.conf by
# daguerre-theme; edit that file, not this one, then re-run
# `daguerre-theme dark`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/daguerre_dark_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=000000
inside-ver-color=000000
inside-wrong-color=000000
inside-clear-color=000000
inside-caps-lock-color=000000
line-color=000000
line-clear-color=000000
line-ver-color=000000

# Ring: state feedback, encoded as tonal weight (no hue available)
ring-color=FFFFFF
ring-ver-color=9E9E9E
ring-wrong-color=D4D4D4
ring-clear-color=8C8C8C
ring-caps-lock-color=C2C2C2

# Per-keystroke highlight segments
key-hl-color=B0B0B0
bs-hl-color=D4D4D4
caps-lock-key-hl-color=C2C2C2
caps-lock-bs-hl-color=D4D4D4
separator-color=8C8C8C

# Typed-character count / status text
text-color=F5F5F5
text-clear-color=8C8C8C
text-ver-color=F5F5F5
text-wrong-color=D4D4D4
text-caps-lock-color=C2C2C2

indicator-radius=150
font-size=32
