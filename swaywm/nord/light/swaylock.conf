# Swaylock configuration — Nord Light
# Plain wallpaper with a colored indicator ring, Nord-matched per state:
# frost blue while typing, yellow while verifying, red on a wrong password,
# purple on Caps Lock, border-neutral once cleared.
# Triggered by $mod+Escape and by swayidle after 15 minutes (see sway config).
# Generated from ~/dotfiles/swaywm/nord/light/swaylock.conf by
# nord-theme; edit that file, not this one, then re-run `nord-theme light`.
#
# Uses the official (vanilla) swaylock, not the swaylock-effects fork, so
# effect-blur/clock/timestr/datestr/fade-in are NOT available here — if
# swaylock-effects is ever installed instead, those can be reintroduced.

ignore-empty-password
disable-caps-lock-text
image=~/.img/wallpapers/nord_light_lockscreen.png
font=Cascadia Mono
scaling=fill

# Indicator fill/line: solid bg, consistent across every state
inside-color=ECEFF4
inside-ver-color=ECEFF4
inside-wrong-color=ECEFF4
inside-clear-color=ECEFF4
inside-caps-lock-color=ECEFF4
line-color=ECEFF4
line-clear-color=ECEFF4
line-ver-color=ECEFF4

# Ring: state feedback color
ring-color=5E81AC
ring-ver-color=EBCB8B
ring-wrong-color=BF616A
ring-clear-color=D8DEE9
ring-caps-lock-color=B48EAD

# Per-keystroke highlight segments
key-hl-color=A3BE8C
bs-hl-color=BF616A
caps-lock-key-hl-color=B48EAD
caps-lock-bs-hl-color=BF616A
separator-color=D8DEE9

# Typed-character count / status text
text-color=2E3440
text-clear-color=4C566A
text-ver-color=2E3440
text-wrong-color=BF616A
text-caps-lock-color=B48EAD

indicator-radius=150
font-size=32
