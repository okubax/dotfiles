# offlineimap config — syncs IMAP accounts into local Maildir under ~/.mail.
# This is a generic 2-account EXAMPLE showing the two auth patterns this
# setup supports; fill in your own account(s) and delete what you don't need.
#
# OAuth2 tokens come from ortie (https://github.com/pimalaya/ortie), see
# offlineimap.py — oauth2_access_token_eval bypasses offlineimap's own OAuth2
# refresh machinery entirely, so no client-id/secret/refresh-token lives here.
# Plain-password accounts pull their password from pass(1) instead (see
# get_pass() in offlineimap.py), never written in cleartext in this file.
#
# Gmail accounts sync "[Gmail]/All Mail" only (renamed to INBOX locally), not
# also "INBOX"/labels — Gmail's IMAP exposes labels as folders, so the same
# message lives under multiple "folders" simultaneously; offlineimap has no
# cross-folder dedup (confirmed against its own source, there is no
# X-GM-MSGID-based skip), so syncing both would double-store on disk. All
# Mail is the superset of everything except Trash/Spam, which are synced
# separately since those genuinely don't overlap with it. Depending on your
# account's locale, the remote folder names may be "[Gmail]/All Mail" and
# "[Gmail]/Trash" (US default) instead of "[Google Mail]/All Mail" and
# "[Google Mail]/Bin" (UK) used below — check your account's actual folder
# names (e.g. via a throwaway folderfilter lambda that prints repr(f)) before
# assuming either.

[general]
accounts = Gmail, GenericIMAP
pythonfile = ~/dotfiles/offlineimap/offlineimap.py
ui = ttyui

# --------------------------------------------------------------------------
# Gmail — OAuth2 via ortie
# --------------------------------------------------------------------------

[Account Gmail]
localrepository = Gmail-Local
remoterepository = Gmail-Remote

[Repository Gmail-Local]
type = Maildir
localfolders = ~/.mail/gmail
nametrans = lambda f: {
        'INBOX': '[Google Mail]/All Mail',
        'Drafts': '[Google Mail]/Drafts',
        'Trash': '[Google Mail]/Bin',
        'Spam':  '[Google Mail]/Spam',
    }.get(f, f)

[Repository Gmail-Remote]
type = Gmail
remoteuser = YOUR_ADDRESS@gmail.com
auth_mechanisms = XOAUTH2
# "gmail" here is the account name you configured in ortie.
oauth2_access_token_eval = get_ortie_token("gmail")
sslcacertfile = /etc/ssl/certs/ca-certificates.crt
folderfilter = lambda f: f in ['[Google Mail]/All Mail', '[Google Mail]/Bin', '[Google Mail]/Spam', '[Google Mail]/Drafts']
nametrans = lambda f: {
        '[Google Mail]/All Mail': 'INBOX',
        '[Google Mail]/Drafts':   'Drafts',
        '[Google Mail]/Bin':      'Trash',
        '[Google Mail]/Spam':     'Spam',
    }.get(f, f)

# --------------------------------------------------------------------------
# Generic IMAP account — plain username/password via pass(1)
# (e.g. Yahoo with an app password, or a cPanel-hosted mailbox)
# --------------------------------------------------------------------------

[Account GenericIMAP]
localrepository = GenericIMAP-Local
remoterepository = GenericIMAP-Remote

[Repository GenericIMAP-Local]
type = Maildir
localfolders = ~/.mail/generic

[Repository GenericIMAP-Remote]
type = IMAP
remotehost = imap.example.com
remoteport = 993
ssl = yes
remoteuser = you@example.com
# "Mail/Example/you" here is a pass(1) entry, e.g. created with:
#   pass insert Mail/Example/you
remotepasseval = get_pass("Mail/Example/you")
sslcacertfile = /etc/ssl/certs/ca-certificates.crt
