# Kitty terminal configuration

# Font: Ubuntu Mono in all styles
font_family Ubuntu Mono
bold_font Ubuntu Mono Bold
italic_font Ubuntu Mono Italic
bold_italic_font Ubuntu Mono Bold Italic
window_padding_width 15
font_size 11

# Color scheme (alternatives kept for quick switching)
# zephyr_light/zephyr_dusk/zephyr_dark track
# ../swaywm/zephyr/{light,dusk,dark}/kitty.conf — switch all at once with
# `zephyr-theme light|dusk|dark`. harmattan_light/harmattan_dusk/harmattan_dark
# track ../swaywm/harmattan/{light,dusk,dark}/kitty.conf — switch all at once
# with `harmattan-theme light|dusk|dark`. Or just edit the include below by
# hand for kitty alone.
#include ./colors/paradise.conf
#include ./colors/nord.conf
#include ./colors/macchiato.conf
include ./colors/zephyr_light.conf
#include ./colors/zephyr_dusk.conf
#include ./colors/zephyr_dark.conf
#include ./colors/harmattan_light.conf
#include ./colors/harmattan_dusk.conf
#include ./colors/harmattan_dark.conf
