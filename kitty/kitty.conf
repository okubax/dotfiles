# Kitty terminal configuration

# Font: Ubuntu Mono in all styles
font_family Ubuntu Mono
bold_font Ubuntu Mono Bold
italic_font Ubuntu Mono Italic
bold_italic_font Ubuntu Mono Bold Italic
window_padding_width 15
font_size 11

# Color scheme (alternatives kept for quick switching). Each `<family>_theme
# light|dusk|dark` script (zephyr-theme/harmattan-theme/solarized-theme/
# nord-theme/catppuccin-theme) switches all at once; edit the include below
# by hand for kitty alone.
#include ./colors/paradise.conf
#include ./colors/nord.conf
include ./colors/zephyr_light.conf
#include ./colors/zephyr_dusk.conf
#include ./colors/zephyr_dark.conf
#include ./colors/harmattan_light.conf
#include ./colors/harmattan_dusk.conf
#include ./colors/harmattan_dark.conf
#include ./colors/solarized_dark.conf
#include ./colors/solarized_light.conf
#include ./colors/nord_light.conf
#include ./colors/nord_dusk.conf
#include ./colors/nord_dark.conf
#include ./colors/catppuccin_light.conf
#include ./colors/catppuccin_dusk.conf
#include ./colors/catppuccin_dark.conf
