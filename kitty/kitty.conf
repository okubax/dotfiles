# Kitty terminal configuration

# Font: Cascadia Mono in all styles (ttf-cascadia-code package; no
# ligatures, unlike Cascadia Code — cleaner for a terminal).
font_family Cascadia Mono
bold_font Cascadia Mono Bold
italic_font Cascadia Mono Italic
bold_italic_font Cascadia Mono Bold Italic
window_padding_width 15
font_size 11

# Color scheme (alternatives kept for quick switching). Each `<family>_theme
# light|dark` script (litho-theme/vellum-theme/daguerre-theme/
# verdigris-theme) switches all at once; edit the include below by hand
# for kitty alone.
#include ./colors/litho_light.conf
#include ./colors/litho_dark.conf
#include ./colors/vellum_light.conf
#include ./colors/vellum_dark.conf
#include ./colors/daguerre_light.conf
#include ./colors/daguerre_dark.conf
include ./colors/verdigris_light.conf
#include ./colors/verdigris_dark.conf
