# Vellum Dark — kitty terminal colors
# See ../../swaywm/vellum/dark/palette.md for where each value comes
# from, including the cyan->link / orange->yellow monochrome hue collapse.

foreground              #DCDCDC
background              #2E2E2E
selection_foreground    #2E2E2E
selection_background    #E6E6E6

cursor                  #DCDCDC
cursor_text_color       #2E2E2E

url_color               #C6C6C6

active_border_color     #E6E6E6
inactive_border_color   #5E5E5E
bell_border_color       #A2A2A2

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #2E2E2E
active_tab_background   #E6E6E6
inactive_tab_foreground #8C8C8C
inactive_tab_background #363636
tab_bar_background      #2E2E2E

mark1_foreground #2E2E2E
mark1_background #E6E6E6
mark2_foreground #2E2E2E
mark2_background #9E9E9E
mark3_foreground #2E2E2E
mark3_background #C6C6C6

# The 16 terminal colors — monochrome: no hue, so each "color" slot is a
# distinct gray step (cyan collapses onto link, orange onto yellow; see
# palette.md).

# black
color0  #363636
color8  #2E2E2E

# red
color1  #D2D2D2
color9  #D2D2D2

# green
color2  #B4B4B4
color10 #5E5E5E

# yellow
color3  #A2A2A2
color11 #8C8C8C

# blue (-> accent, the boldest tone this scheme has)
color4  #E6E6E6
color12 #DCDCDC

# magenta (-> purple)
color5  #9E9E9E
color13 #C6C6C6

# cyan (-> link)
color6  #C6C6C6
color14 #8C8C8C

# white
color7  #464646
color15 #DCDCDC
