# Litho Dark — kitty terminal colors
# See ../../swaywm/litho/dark/palette.md for where each value comes
# from, including the cyan->link / orange->yellow monochrome hue collapse.

foreground              #FFFFFF
background              #000000
selection_foreground    #000000
selection_background    #FFFFFF

cursor                  #FFFFFF
cursor_text_color       #000000

url_color               #BFBFBF

active_border_color     #FFFFFF
inactive_border_color   #595959
bell_border_color       #D9D9D9

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #000000
active_tab_background   #FFFFFF
inactive_tab_foreground #8C8C8C
inactive_tab_background #0D0D0D
tab_bar_background      #000000

mark1_foreground #000000
mark1_background #FFFFFF
mark2_foreground #000000
mark2_background #737373
mark3_foreground #000000
mark3_background #BFBFBF

# The 16 terminal colors — monochrome: no hue, so each "color" slot is a
# distinct gray step (cyan collapses onto link, orange onto yellow; see
# palette.md).

# black
color0  #0D0D0D
color8  #000000

# red
color1  #F2F2F2
color9  #F2F2F2

# green
color2  #A6A6A6
color10 #595959

# yellow
color3  #D9D9D9
color11 #8C8C8C

# blue (-> accent, the boldest tone this scheme has)
color4  #FFFFFF
color12 #FFFFFF

# magenta (-> purple)
color5  #737373
color13 #BFBFBF

# cyan (-> link)
color6  #BFBFBF
color14 #8C8C8C

# white
color7  #262626
color15 #FFFFFF
