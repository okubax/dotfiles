# Daguerre Light — kitty terminal colors
# See ../../swaywm/daguerre/light/palette.md for where each value comes
# from, including the cyan->link / orange->yellow monochrome hue collapse.

foreground              #0A0A0A
background              #FFFFFF
selection_foreground    #FFFFFF
selection_background    #000000

cursor                  #0A0A0A
cursor_text_color       #FFFFFF

url_color               #191919

active_border_color     #000000
inactive_border_color   #858585
bell_border_color       #616161

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #FFFFFF
active_tab_background   #000000
inactive_tab_foreground #737373
inactive_tab_background #E5E5E5
tab_bar_background      #FFFFFF

mark1_foreground #FFFFFF
mark1_background #000000
mark2_foreground #FFFFFF
mark2_background #3D3D3D
mark3_foreground #FFFFFF
mark3_background #191919

# The 16 terminal colors — monochrome: no hue, so each "color" slot is a
# distinct gray step (cyan collapses onto link, orange onto yellow; see
# palette.md).

# black (color8 kept distinct from background — several tools, e.g.
# zsh-autosuggestions, use bright-black as a muted/dim foreground, and
# on prior identical values that text was invisible)
color0  #E5E5E5
color8  #999999

# red
color1  #2B2B2B
color9  #2B2B2B

# green
color2  #4F4F4F
color10 #858585

# yellow
color3  #616161
color11 #737373

# blue (-> accent, the boldest tone this scheme has)
color4  #000000
color12 #0A0A0A

# magenta (-> purple)
color5  #3D3D3D
color13 #191919

# cyan (-> link)
color6  #191919
color14 #737373

# white
color7  #B2B2B2
color15 #0A0A0A
