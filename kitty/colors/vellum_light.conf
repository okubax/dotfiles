# The 16 terminal colors — monochrome: no hue, so each "color" slot is a
# distinct gray step (cyan collapses onto link, orange onto yellow; see
# palette.md).

# black
color0  #E0E0E0
color8  #E9E9E9

# red
color1  #404040
color9  #404040

# green
color2  #626262
color10 #AEAEAE

# yellow
color3  #6E6E6E
color11 #7A7A7A

# blue (-> accent, the boldest tone this scheme has)
color4  #262626
color12 #333333

# magenta (-> purple)
color5  #6A6A6A
color13 #4E4E4E

# cyan (-> link)
color6  #4E4E4E
color14 #7A7A7A

# white
color7  #CCCCCC
color15 #333333
