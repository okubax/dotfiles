mark3_foreground #000000
mark3_background #E6E6E6

# The 16 terminal colors — monochrome: no hue, so each "color" slot is a
# distinct gray step (cyan collapses onto link, orange onto yellow; see
# palette.md).

# black
color0  #1A1A1A
color8  #000000

# red
color1  #D4D4D4
color9  #D4D4D4

# green
color2  #B0B0B0
color10 #7A7A7A

# yellow
color3  #9E9E9E
color11 #8C8C8C

# blue (-> accent, the boldest tone this scheme has)
color4  #FFFFFF
color12 #F5F5F5

# magenta (-> purple)
color5  #C2C2C2
color13 #E6E6E6

# cyan (-> link)
color6  #E6E6E6
color14 #8C8C8C

# white
color7  #4D4D4D
color15 #F5F5F5
