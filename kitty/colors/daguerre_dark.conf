# Daguerre Dark — kitty terminal colors
# See ../../swaywm/daguerre/dark/palette.md for where each value comes
# from, including the cyan->link / orange->yellow monochrome hue collapse.

foreground              #F5F5F5
background              #000000
selection_foreground    #000000
selection_background    #FFFFFF

cursor                  #F5F5F5
cursor_text_color       #000000

url_color               #E6E6E6

active_border_color     #FFFFFF
inactive_border_color   #7A7A7A
bell_border_color       #9E9E9E

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #000000
active_tab_background   #FFFFFF
inactive_tab_foreground #8C8C8C
